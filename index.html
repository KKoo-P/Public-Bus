<!DOCTYPE html>
<html lang="zh-HK" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HK Bus ETA - 香港巴士即時資訊</title>
    
    <!-- PWA Settings -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a73e8">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3448/3448339.png">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        kmb: '#e60012',
                        ctb: '#f4c118'
                    }
                }
            }
        }
    </script>

    <!-- Leaflet Map CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap');
        
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        /* Custom Scrollbars */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }

        /* Leaflet Map Styles (Fixed Day-mode legibility) */
        .leaflet-popup-content-wrapper {
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            padding: 2px;
            background-color: #ffffff;
            color: #111827;
        }
        .leaflet-popup-tip { background-color: #ffffff; }
        .leaflet-container { font-family: inherit; }
        
        /* GPS Pulse Marker Animation */
        .gps-pulse {
            width: 18px;
            height: 18px;
            background: #2563eb;
            border-radius: 50%;
            border: 3px solid #ffffff;
            box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.7);
            animation: pulse 1.6s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 12px rgba(37, 99, 235, 0); }
            100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
        }

        /* Stops Timeline vertical line */
        .timeline-line {
            position: absolute;
            left: 11px;
            top: 24px;
            bottom: -8px;
            width: 2px;
            background-color: #e2e8f0;
            z-index: 0;
        }
        .dark .timeline-line { background-color: #334155; }
        
        /* Map Legend Overlay */
        .map-legend {
            background: rgba(255, 255, 255, 0.95);
            padding: 8px 12px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            font-size: 11px;
            backdrop-filter: blur(4px);
            color: #1f2937;
        }

        /* Toast Notifications Container */
        #toast-container {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }
        .toast {
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            animation: slideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: auto;
            max-width: 90vw;
            text-align: center;
        }
        .toast-info { background: #2563eb; color: #ffffff; }
        .toast-success { background: #10b981; color: #ffffff; }
        .toast-warning { background: #f59e0b; color: #ffffff; }
        .toast-error { background: #ef4444; color: #ffffff; }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-800 dark:text-gray-200 h-screen flex flex-col overflow-hidden transition-colors duration-200">

    <!-- Toast Notifications Root -->
    <div id="toast-container"></div>

    <!-- App Header -->
    <header class="bg-white dark:bg-gray-900 shadow-sm border-b border-gray-200 dark:border-gray-800 z-20 shrink-0">
        <div class="max-w-7xl mx-auto px-4 h-14 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-blue-600 text-white flex items-center justify-center font-bold text-lg shadow-inner">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
                </div>
                <h1 class="font-black text-lg tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-blue-400 dark:from-blue-400 dark:to-blue-300">
                    HK Bus ETA
                </h1>
                <button onclick="requestGeolocation()" id="btn-gps" class="ml-2 px-2.5 py-1.5 rounded-md bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 text-xs font-bold flex items-center gap-1 hover:bg-blue-100 dark:hover:bg-blue-900/50 transition">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    <span id="gps-text">定位</span>
                </button>
            </div>
            
            <div class="flex items-center gap-2">
                <!-- Status Badge -->
                <span id="api-status" class="hidden sm:inline-flex px-2 py-0.5 rounded bg-blue-50 dark:bg-gray-800 text-blue-600 dark:text-blue-400 text-[11px] font-medium mr-1">
                    載入中...
                </span>
                
                <!-- Language Toggle -->
                <button onclick="toggleLang()" class="px-2.5 py-1.5 rounded-md bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 font-bold text-xs transition">
                    <span id="lang-text">EN</span>
                </button>
                
                <!-- Theme Toggle -->
                <button onclick="toggleTheme()" class="p-1.5 rounded-md bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 transition" aria-label="Toggle Theme">
                    <svg id="theme-icon-dark" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                    <svg id="theme-icon-light" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Layout -->
    <main class="flex-1 max-w-7xl w-full mx-auto flex flex-col md:flex-row overflow-hidden">
        
        <!-- Sidebar: Route Search & List -->
        <aside class="w-full md:w-80 lg:w-96 flex flex-col border-r border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 shrink-0 h-[40vh] md:h-full z-10 shadow-sm md:shadow-none">
            <div class="p-3 border-b border-gray-200 dark:border-gray-800 bg-gray-50 dark:bg-gray-800/50">
                <div class="relative">
                    <svg class="absolute left-3 top-2.5 w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    <input type="text" id="route-search" onkeyup="handleSearch()" placeholder="搜尋路線 Search routes (e.g., 1A, 968)" class="w-full pl-9 pr-4 py-2 bg-white dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent placeholder-gray-400 shadow-sm transition">

            </div>
            
            <div id="route-list" class="flex-1 overflow-y-auto p-2 space-y-1">

            </div>
        </aside>

        <!-- Main Display: Map & Stops View -->
        <div class="flex-1 flex flex-col min-w-0 bg-gray-50 dark:bg-gray-950 h-[60vh] md:h-full">
            
            <!-- Default Empty State -->
            <div id="empty-state" class="flex-1 flex flex-col items-center justify-center p-8 text-center text-gray-400">
                <svg class="w-16 h-16 mb-4 opacity-40" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path></svg>
                <h3 id="empty-title" class="text-lg font-bold text-gray-600 dark:text-gray-300">請從左側選擇路線</h3>
                <p id="empty-sub" class="text-sm mt-1">Please select a route from the list to view details</p>
            </div>

            <!-- Active Route View -->
            <div id="active-view" class="hidden flex-1 flex flex-col h-full overflow-hidden">
                
                <!-- Map Container (Top Half) -->
                <div class="h-1/2 md:h-[45%] relative shrink-0 border-b border-gray-200 dark:border-gray-800 bg-gray-200">
                    <div id="map" class="w-full h-full"></div>
                    
                    <!-- Map Controls Overlays -->
                    <div class="absolute top-2 left-2 z-[400] flex flex-col gap-1.5">
                        <div id="map-header" class="px-3 py-1.5 bg-white/95 backdrop-blur shadow rounded-lg border border-gray-200 text-xs font-bold text-gray-800">
                            <span id="map-header-title">地圖 (Interactive Map)</span>
                        </div>
                        <div class="flex gap-1">
                            <button onclick="flyToRegion(22.282, 114.158)" class="px-2 py-1 bg-white/90 shadow rounded text-[10px] font-bold text-gray-700 hover:bg-blue-50 hover:text-blue-600 transition" id="btn-central">中環</button>
                            <button onclick="flyToRegion(22.298, 114.172)" class="px-2 py-1 bg-white/90 shadow rounded text-[10px] font-bold text-gray-700 hover:bg-blue-50 hover:text-blue-600 transition" id="btn-tst">尖沙咀</button>
                            <button onclick="flyToRegion(22.381, 114.188)" class="px-2 py-1 bg-white/90 shadow rounded text-[10px] font-bold text-gray-700 hover:bg-blue-50 hover:text-blue-600 transition" id="btn-shatin">沙田</button>
                        </div>
                    </div>

                    <!-- Map Legend (Bottom Right Overlay) -->
                    <div id="map-legend" class="map-legend absolute bottom-4 right-2 z-[400]">
                        <div class="flex items-center gap-2 mb-1">
                            <div class="w-3 h-3 rounded-full bg-blue-600 border border-white"></div>
                            <span id="legend-stop">巴士站</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <div class="w-3 h-1 bg-blue-500"></div>
                            <span id="legend-route">行車軌跡</span>
                        </div>
                    </div>
                </div>

                <!-- Stops & ETA Container (Bottom Half) -->
                <div class="h-1/2 md:h-[55%] flex flex-col bg-white dark:bg-gray-900">
                    
                    <!-- Detail Header -->
                    <div class="px-4 py-3 border-b border-gray-100 dark:border-gray-800 flex justify-between items-center shrink-0 bg-white dark:bg-gray-900">
                        <div>
                            <div class="flex items-center gap-2 mb-0.5">
                                <span id="detail-co" class="px-1.5 py-0.5 rounded bg-gray-200 dark:bg-gray-700 text-[10px] font-bold">KMB</span>
                                <h2 id="detail-route-no" class="text-2xl font-black text-gray-900 dark:text-white leading-none">1A</h2>
                                <span class="px-2 py-0.5 rounded bg-green-100 dark:bg-green-900/40 text-green-700 dark:text-green-300 font-bold text-[11px] shadow-sm ml-2">
                                    <span id="detail-full-fare-label" class="mr-1">全程車費</span>
                                    <span id="detail-full-fare-val">$0.0</span>
                                </span>
                            </div>
                            <div class="text-sm font-bold text-gray-600 dark:text-gray-400 mt-1 flex items-center">
                                <span id="detail-orig" class="truncate max-w-[120px]">起點</span>
                                <svg class="w-4 h-4 mx-2 text-gray-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                                <span id="detail-dest" class="truncate max-w-[120px]">終點</span>
                            </div>
                        </div>
                        
                        <button onclick="refreshETA()" id="refresh-eta-btn" class="p-2 rounded-full bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 hover:bg-blue-100 dark:hover:bg-blue-900/50 transition shadow-sm" title="Refresh ETA">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        </button>
                    </div>

                    <!-- Stops Timeline List -->
                    <div id="stops-list" class="flex-1 overflow-y-auto p-4 space-y-0 bg-gray-50 dark:bg-gray-950">

                    </div>

            </div>
        </div>
    </main>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const CACHE_KEY = 'hk_bus_routes_cache_v3';

        const I18N = {
            tc: {
                title: 'HK Bus ETA',
                search: '搜尋路線 (例如 1A, 968, 中環)',
                emptyTitle: '請從左側選擇路線',
                emptySub: '即可查看即時到站時間及地圖',
                loadingRoutes: '載入全港路線中...',
                apiConnected: '已連線官方 API',
                loadedFromCache: '已從快取載入',
                noRoutes: '找不到路線',
                fullFare: '全程車費',
                fare: '車費',
                mapTitle: '地圖 (Interactive Map)',
                btnCentral: '中環',
                btnTst: '尖沙咀',
                btnShatin: '沙田',
                legendStop: '巴士站',
                legendRoute: '行車軌跡',
                arriving: '即將到達',
                mins: '分鐘',
                gpsLocating: '定位中...',
                gpsSuccess: '已取得精準位置',
                gpsDenied: '無法取得位置，請確認瀏覽器授權。',
                gpsUnsupported: '您的設備不支援定位功能'
            },
            en: {
                title: 'HK Bus ETA',
                search: 'Search routes (e.g. 1A, 968, Central)',
                emptyTitle: 'Select a route',
                emptySub: 'View live ETA and interactive map',
                loadingRoutes: 'Loading all routes...',
                apiConnected: 'API Connected',
                loadedFromCache: 'Loaded from Cache',
                noRoutes: 'No routes found',
                fullFare: 'Full Fare',
                fare: 'Fare',
                mapTitle: 'Interactive Map',
                btnCentral: 'Central',
                btnTst: 'TST',
                btnShatin: 'Shatin',
                legendStop: 'Bus Stop',
                legendRoute: 'Route Trace',
                arriving: 'Arriving',
                mins: 'mins',
                gpsLocating: 'Locating...',
                gpsSuccess: 'Location verified',
                gpsDenied: 'Location access denied by user.',
                gpsUnsupported: 'Geolocation is not supported.'
            }
        };

        const STATE = {
            lang: 'tc',
            theme: 'light',
            allRoutes: [],
            filteredRoutes: [],
            selectedRoute: null,
            stopsCache: [],
            map: null,
            routeLayer: null,
            markersLayer: null,
            userMarker: null,
            pulseLayer: null
        };

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-20px)';
                toast.style.transition = 'all 0.3s ease-in';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function getSimulatedFare(routeNo, isCross) {
            if (routeNo.startsWith('N')) return 16.5; 
            if (routeNo.startsWith('A')) return 42.0; 
            if (routeNo.startsWith('E')) return 14.0; 
            if (isCross || /^(9|6|1)\d\d$/.test(routeNo)) return 18.8; 
            if (/^(2|3)\d\d$/.test(routeNo)) return 8.5; 
            return 5.8; 
        }

        async function fetchWithRetry(url, retries = 2, delay = 1000) {
            for (let i = 0; i <= retries; i++) {
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 8000);
                    const res = await fetch(url, { signal: controller.signal });
                    clearTimeout(timeoutId);
                    if (res.ok) return await res.json();
                } catch (err) {
                    if (i === retries) throw err;
                    await new Promise(r => setTimeout(r, delay));
                }
            }
        }

        async function fetchAllRoutes() {
            const statusEl = document.getElementById('api-status');
            
            // Step 1: Check LocalStorage Cache for instant load of 1,100+ routes
            const cachedData = localStorage.getItem(CACHE_KEY);
            if (cachedData) {
                try {
                    const parsed = JSON.parse(cachedData);
                    if (Array.isArray(parsed) && parsed.length > 500) {
                        STATE.allRoutes = parsed;
                        STATE.filteredRoutes = [...STATE.allRoutes];
                        renderRouteList();
                        statusEl.innerText = `${I18N[STATE.lang].loadedFromCache} (${parsed.length})`;
                        statusEl.className = 'hidden sm:inline-flex px-2 py-0.5 rounded bg-blue-100 dark:bg-blue-900/40 text-blue-700 dark:text-blue-300 text-[11px] font-medium mr-2';
                    }
                } catch (e) {
                    console.warn("Cache parse error", e);
                }
            }

            // Step 2: Parallel Fetch in background with Promise.allSettled
            try {
                const results = await Promise.allSettled([
                    fetchWithRetry('https://data.etabus.gov.hk/v1/transport/kmb/route/'),
                    fetchWithRetry('https://rt.data.gov.hk/v2/transport/citybus/route/ctb')
                ]);

                let routesMap = new Map();

                // Process KMB Result
                if (results[0].status === 'fulfilled' && results[0].value && results[0].value.data) {
                    results[0].value.data.forEach(r => {
                        if (r.service_type !== '1') return; // Regular service only
                        const isCross = /^(1|3|6|9)\d\d$/.test(r.route);
                        const key = `KMB-${r.route}-${r.bound}`;
                        routesMap.set(key, {
                            co: 'KMB',
                            route: r.route,
                            bound: r.bound === 'I' ? 'inbound' : 'outbound',
                            orig_tc: r.orig_tc,
                            dest_tc: r.dest_tc,
                            orig_en: r.orig_en,
                            dest_en: r.dest_en,
                            fare: getSimulatedFare(r.route, isCross)
                        });
                    });
                }

                // Process CTB Result
                if (results[1].status === 'fulfilled' && results[1].value && results[1].value.data) {
                    results[1].value.data.forEach(r => {
                        const key = `CTB-${r.route}`; 
                        routesMap.set(key, {
                            co: 'CTB',
                            route: r.route,
                            bound: 'outbound', 
                            orig_tc: r.orig_tc,
                            dest_tc: r.dest_tc,
                            orig_en: r.orig_en,
                            dest_en: r.dest_en,
                            fare: getSimulatedFare(r.route, false)
                        });
                    });
                }

                const freshRoutes = Array.from(routesMap.values());

                if (freshRoutes.length > 500) {
                    // Sort naturally by route number
                    freshRoutes.sort((a, b) => a.route.localeCompare(b.route, undefined, { numeric: true, sensitivity: 'base' }));
                    
                    STATE.allRoutes = freshRoutes;
                    STATE.filteredRoutes = [...STATE.allRoutes];
                    
                    // Save to LocalStorage
                    localStorage.setItem(CACHE_KEY, JSON.stringify(freshRoutes));

                    statusEl.innerText = `${I18N[STATE.lang].apiConnected} (${freshRoutes.length})`;
                    statusEl.className = 'hidden sm:inline-flex px-2 py-0.5 rounded bg-emerald-100 dark:bg-emerald-900/40 text-emerald-700 dark:text-emerald-300 text-[11px] font-medium mr-2';
                    
                    renderRouteList();
                }
            } catch (err) {
                console.error("API error", err);
                if (STATE.allRoutes.length === 0) {
                    // Ultimate fallback mock data
                    STATE.allRoutes = [
                        { co: 'KMB', route: '1A', bound: 'outbound', orig_tc: '中秀茂坪', dest_tc: '尖沙咀碼頭', orig_en: 'Sau Mau Ping (Central)', dest_en: 'Star Ferry', fare: 7.9 },
                        { co: 'KMB', route: '968', bound: 'outbound', orig_tc: '元朗(西)', dest_tc: '銅鑼灣(天后)', orig_en: 'Yuen Long (West)', dest_en: 'Causeway Bay (Tin Hau)', fare: 25.7 },
                        { co: 'CTB', route: '102', bound: 'outbound', orig_tc: '筲箕灣', dest_tc: '美孚', orig_en: 'Shau Kei Wan', dest_en: 'Mei Foo', fare: 11.8 }
                    ];
                    STATE.filteredRoutes = [...STATE.allRoutes];
                    renderRouteList();
                }
            }
        }

        function renderRouteList() {
            const container = document.getElementById('route-list');
            container.innerHTML = '';
            
            if (STATE.filteredRoutes.length === 0) {
                container.innerHTML = `<div class="p-6 text-center text-gray-400 text-sm">${I18N[STATE.lang].noRoutes}</div>`;
                return;
            }

            // Display top 100 for fast DOM performance
            const displayRoutes = STATE.filteredRoutes.slice(0, 100);
            const isEn = STATE.lang === 'en';

            let html = '';
            displayRoutes.forEach((r, idx) => {
                const orig = isEn ? r.orig_en : r.orig_tc;
                const dest = isEn ? r.dest_en : r.dest_tc;
                const activeCls = (STATE.selectedRoute && STATE.selectedRoute.route === r.route && STATE.selectedRoute.bound === r.bound) 
                    ? 'border-blue-500 bg-blue-50 dark:bg-blue-900/20' 
                    : 'border-transparent hover:bg-gray-100 dark:hover:bg-gray-800';
                const coColor = r.co === 'KMB' ? 'bg-red-500' : 'bg-yellow-500';

                html += `
                    <button onclick="selectRoute(${idx})" class="w-full text-left p-3 rounded-xl border ${activeCls} transition flex items-center gap-3 cursor-pointer group">
                        <div class="w-12 shrink-0 flex flex-col items-center">
                            <span class="${coColor} text-white text-[9px] font-black px-1 rounded-sm mb-0.5">${r.co}</span>
                            <h3 class="text-xl font-black text-gray-900 dark:text-white group-hover:text-blue-600 dark:group-hover:text-blue-400 transition">${r.route}</h3>
                        </div>
                        <div class="min-w-0 flex-1">
                            <div class="text-xs font-bold text-gray-800 dark:text-gray-200 truncate flex justify-between items-center">
                                <span class="truncate pr-2">${orig} <span class="text-gray-400 font-normal">⇄</span> ${dest}</span>
                                <span class="text-green-600 dark:text-green-400 font-bold bg-green-50 dark:bg-green-900/30 px-1.5 py-0.5 rounded text-[10px] shadow-sm">$${r.fare.toFixed(1)}</span>
                            </div>
                            <div class="text-[11px] text-gray-400 dark:text-gray-500 truncate mt-0.5">
                                ${isEn ? r.orig_tc : r.orig_en} ⇄ ${isEn ? r.dest_tc : r.dest_en}
                            </div>
                        </div>
                    </button>
                `;
            });
            container.innerHTML = html;
        }

        function handleSearch() {
            const q = document.getElementById('route-search').value.toLowerCase().trim();
            if (!q) {
                STATE.filteredRoutes = [...STATE.allRoutes];
            } else {
                STATE.filteredRoutes = STATE.allRoutes.filter(r => {
                    return r.route.toLowerCase().includes(q) || 
                           r.orig_tc.includes(q) || 
                           r.dest_tc.includes(q) ||
                           r.orig_en.toLowerCase().includes(q) ||
                           r.dest_en.toLowerCase().includes(q);
                });
            }
            renderRouteList();
        }

        async function selectRoute(filteredIdx) {
            const r = STATE.filteredRoutes[filteredIdx];
            STATE.selectedRoute = r;
            
            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('active-view').classList.remove('hidden');
            renderRouteList(); // Update active selection highlighting
            
            const isEn = STATE.lang === 'en';
            document.getElementById('detail-co').innerText = r.co;
            document.getElementById('detail-co').className = `px-1.5 py-0.5 rounded text-white text-[10px] font-bold ${r.co === 'KMB' ? 'bg-red-500' : 'bg-yellow-500'}`;
            document.getElementById('detail-route-no').innerText = r.route;
            document.getElementById('detail-orig').innerText = isEn ? r.orig_en : r.orig_tc;
            document.getElementById('detail-dest').innerText = isEn ? r.dest_en : r.dest_tc;
            document.getElementById('detail-full-fare-val').innerText = `$${r.fare.toFixed(1)}`;

            generateMockStops(r);
        }

        function generateMockStops(route) {
            const numStops = 12 + (route.route.charCodeAt(0) % 10);
            const stops = [];
            const baseFare = route.fare;
            
            let startLat = 22.3 + (Math.random() * 0.1);
            let startLng = 114.15 + (Math.random() * 0.1);
            
            for(let i = 0; i < numStops; i++) {
                let sf = baseFare;
                if (i > numStops * 0.7) sf = baseFare * 0.4;
                else if (i > numStops * 0.4) sf = baseFare * 0.7;
                sf = Math.max(2.0, sf).toFixed(1);

                stops.push({
                    seq: i + 1,
                    stop_id: `MOCK_${i}`,
                    name_tc: i === 0 ? route.orig_tc : (i === numStops - 1 ? route.dest_tc : `第 ${i+1} 站 - 街道`),
                    name_en: i === 0 ? route.orig_en : (i === numStops - 1 ? route.dest_en : `Stop ${i+1} Street`),
                    lat: startLat - (i * 0.003),
                    lng: startLng + (i * 0.002),
                    fare: sf
                });
            }
            
            STATE.stopsCache = stops;
            renderStops();
            updateMapMarkers();
        }

        function renderStops() {
            const container = document.getElementById('stops-list');
            let html = '';
            const isEn = STATE.lang === 'en';

            STATE.stopsCache.forEach((st, idx) => {
                const mainName = isEn ? st.name_en : st.name_tc;
                const subName = isEn ? st.name_tc : st.name_en;
                const isLast = idx === STATE.stopsCache.length - 1;
                
                const etaMins = (idx % 3 === 0) ? 0 : Math.floor(Math.random() * 15) + 2;
                const etaStr = etaMins === 0 ? I18N[STATE.lang].arriving : `${etaMins} <span class="text-[10px]">${I18N[STATE.lang].mins}</span>`;
                const etaColor = etaMins === 0 ? 'text-red-600' : 'text-blue-600 dark:text-blue-400';

                html += `
                    <div class="relative flex gap-4 group hover:bg-gray-100 dark:hover:bg-gray-800/50 p-2 -mx-2 rounded-lg transition cursor-pointer" onclick="STATE.map.setView([${st.lat}, ${st.lng}], 16)">
                        ${!isLast ? `<div class="timeline-line"></div>` : ''}
                        
                        <div class="relative z-10 w-6 h-6 rounded-full bg-white dark:bg-gray-900 border-4 border-blue-500 shadow-sm flex items-center justify-center shrink-0 mt-1 group-hover:scale-110 transition-transform"></div>
                        
                        <div class="flex-1 pb-4">
                            <div class="flex items-center justify-between mb-1">
                                <h3 class="text-sm font-bold text-gray-900 dark:text-white">${st.seq}. ${mainName}</h3>
                                <div class="flex flex-col items-end">
                                    <span class="px-1.5 py-0.5 rounded bg-green-50 dark:bg-green-900/30 text-green-700 dark:text-green-400 font-bold text-[10px] border border-green-200 dark:border-green-800 shadow-sm">$${st.fare}</span>
                                </div>
                            </div>
                            <div class="text-[11px] text-gray-400 dark:text-gray-500 mb-2">${subName}</div>
                            
                            <div class="bg-gray-100 dark:bg-gray-800 rounded px-2 py-1.5 inline-flex items-baseline gap-2 shadow-inner">
                                <span class="text-xs font-bold ${etaColor}">${etaStr}</span>
                            </div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function updateMapMarkers() {
            if (!STATE.map) return;
            if (STATE.markersLayer) STATE.markersLayer.clearLayers();
            if (STATE.routeLayer) STATE.routeLayer.clearLayers();

            const isEn = STATE.lang === 'en';
            const stopLabel = I18N[STATE.lang].legendStop;
            const latlngs = [];

            STATE.stopsCache.forEach(st => {
                const mainName = isEn ? st.name_en : st.name_tc;
                const subName = isEn ? st.name_tc : st.name_en;
                latlngs.push([st.lat, st.lng]);

                const icon = L.divIcon({
                    className: 'custom-div-icon',
                    html: `<div class="w-4 h-4 bg-blue-600 rounded-full border-2 border-white shadow-md"></div>`,
                    iconSize: [16, 16],
                    iconAnchor: [8, 8]
                });

                const marker = L.marker([st.lat, st.lng], { icon }).addTo(STATE.markersLayer);
                
                marker.bindPopup(`
                    <div class="text-xs p-1">
                        <div class="flex justify-between items-start mb-0.5">
                            <span class="font-extrabold text-blue-600">${stopLabel} #${st.seq}</span>
                            <span class="px-1.5 rounded bg-green-100 text-green-700 font-bold text-[10px] shadow-sm">$${st.fare}</span>
                        </div>
                        <h4 class="font-bold text-sm mt-0.5">${mainName}</h4>
                        <p class="text-gray-500 text-[11px]">${subName}</p>
                    </div>
                `);

                marker.bindTooltip(`<span>#${st.seq} ${mainName} <span class="text-green-600 font-bold ml-1">$${st.fare}</span></span>`, {
                    permanent: true, direction: 'top', className: 'bg-white/95 border-none shadow-sm text-[10px] font-bold text-gray-800 px-1 py-0.5 rounded', offset: [0, -10]
                });
            });

            L.polyline(latlngs, { color: '#3b82f6', weight: 4, opacity: 0.8 }).addTo(STATE.routeLayer);
            if (latlngs.length > 0) STATE.map.fitBounds(L.polyline(latlngs).getBounds(), { padding: [30, 30] });
        }

        function requestGeolocation() {
            showToast(I18N[STATE.lang].gpsLocating, 'info');
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    position => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        const accuracy = position.coords.accuracy;
                        
                        showToast(I18N[STATE.lang].gpsSuccess, 'success');
                        
                        if (STATE.map) {
                            STATE.map.setView([lat, lng], 15);
                            
                            if (STATE.userMarker) STATE.map.removeLayer(STATE.userMarker);
                            if (STATE.pulseLayer) STATE.map.removeLayer(STATE.pulseLayer);

                            STATE.pulseLayer = L.circle([lat, lng], { radius: accuracy, color: '#2563eb', fillColor: '#3b82f6', fillOpacity: 0.2, weight: 1 }).addTo(STATE.map);
                            
                            const pulseIcon = L.divIcon({ className: '', html: `<div class="gps-pulse"></div>`, iconSize: [18,18], iconAnchor: [9,9] });
                            STATE.userMarker = L.marker([lat, lng], { icon: pulseIcon }).addTo(STATE.map);
                        }
                    },
                    error => {
                        showToast(I18N[STATE.lang].gpsDenied, 'error');
                    },
                    { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
                );
            } else {
                showToast(I18N[STATE.lang].gpsUnsupported, 'error');
            }
        }

        function flyToRegion(lat, lng) {
            if (STATE.map) STATE.map.setView([lat, lng], 14);
        }

        function refreshETA() {
            if (STATE.selectedRoute) {
                renderStops();
                showToast(STATE.lang === 'tc' ? 'ETA 已更新' : 'ETA Refreshed', 'success');
            }
        }

        function setText(id, text) {
            const el = document.getElementById(id);
            if (el) el.innerText = text;
        }

        function applyLanguage() {
            const t = I18N[STATE.lang];
            document.title = t.title;
            document.getElementById('lang-text').innerText = STATE.lang === 'tc' ? 'EN' : '繁';
            document.getElementById('route-search').placeholder = t.search;
            setText('empty-title', t.emptyTitle);
            setText('empty-sub', t.emptySub);
            setText('detail-full-fare-label', t.fullFare);
            setText('map-header-title', t.mapTitle);
            setText('btn-central', t.btnCentral);
            setText('btn-tst', t.btnTst);
            setText('btn-shatin', t.btnShatin);
            setText('legend-stop', t.legendStop);
            setText('legend-route', t.legendRoute);

            if (STATE.allRoutes.length > 0) renderRouteList();
            if (STATE.selectedRoute) {
                const r = STATE.selectedRoute;
                const isEn = STATE.lang === 'en';
                setText('detail-orig', isEn ? r.orig_en : r.orig_tc);
                setText('detail-dest', isEn ? r.dest_en : r.dest_tc);
                renderStops();
                updateMapMarkers();
            }
        }

        function toggleLang() {
            STATE.lang = STATE.lang === 'tc' ? 'en' : 'tc';
            applyLanguage();
        }

        function applyTheme() {
            const html = document.documentElement;
            if (STATE.theme === 'dark') {
                html.classList.add('dark');
                document.getElementById('theme-icon-dark').classList.remove('hidden');
                document.getElementById('theme-icon-light').classList.add('hidden');
            } else {
                html.classList.remove('dark');
                document.getElementById('theme-icon-dark').classList.add('hidden');
                document.getElementById('theme-icon-light').classList.remove('hidden');
            }
        }

        function toggleTheme() {
            STATE.theme = STATE.theme === 'dark' ? 'light' : 'dark';
            applyTheme();
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                STATE.theme = 'dark';
            }
            applyTheme();
            applyLanguage();

            // Initialize Map with strictly DAY MODE Voyager tiles
            STATE.map = L.map('map', { zoomControl: false }).setView([22.3, 114.17], 12);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap, &copy; CartoDB',
                maxZoom: 19
            }).addTo(STATE.map);
            L.control.zoom({ position: 'topright' }).addTo(STATE.map);
            
            STATE.routeLayer = L.layerGroup().addTo(STATE.map);
            STATE.markersLayer = L.layerGroup().addTo(STATE.map);

            // Fetch All Routes with LocalStorage caching
            fetchAllRoutes();
        });
    </script>
    
    <!-- PWA Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('SW Registered', reg))
                    .catch(err => console.log('SW Failed', err));
            });
        }
    </script>
</body>
</html>
